name: wb-sync-rules
on:
  push:
    branches: [main]
    paths: ['_wb_rules.patch']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch and clean up
        run: |
          git apply --verbose _wb_rules.patch
          rm -f _wb_rules.patch .github/workflows/_wb_sync.yml
          git config user.name "workbuddy-bot"
          git config user.email "workbuddy-bot@users.noreply.github.com"
          git add -A
          git commit -m "refactor(haibao): 同步规则库 rules.md"
          git push
